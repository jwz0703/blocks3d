name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scratch-gui depends on the sibling packages through file: links,
      # so each one needs its own node_modules.
      # scratch-render and scratch-paint have no lockfile, so use install.
      - run: npm ci
        working-directory: scratch-vm
      - run: npm install --no-audit --no-fund
        working-directory: scratch-render
      - run: npm install --no-audit --no-fund
        working-directory: scratch-paint
      - run: npm ci
        working-directory: scratch-gui
      # Project pages live under /<repo>/, so assets need that prefix.
      - run: npx webpack --bail
        working-directory: scratch-gui
        env:
          NODE_ENV: production
          ROOT: /${{ github.event.repository.name }}/
          STATIC_PATH: /${{ github.event.repository.name }}/static
      - run: touch scratch-gui/build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scratch-gui/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
